<extend template="base.shtml">

<head id="head">
	<style>
		.thing {
			display: flex;
			text-align: center;
			padding: 1em;
		}
		
		.cover {
			max-width: 150pt;
			max-height: 150pt;
		}
		
		.description {
			flex-grow: 1;
			margin: auto;
			display: grid;
			padding: 1em;
		}

		h1 {
		    text-align: center;
		}
		
		h2 {
			margin: 0;
		}
		
		#content {
			display: flex;
		}
		
		@media screen and (max-width: 500px) {
			.thing {
				flex-direction: column;
				align-items: center;
			}
			#content {
				display: block;
			}
		}
	</style>
</head>

<div id="content">
	<div>
		<h1>original</h1>

		<div :loop="$page.asset('data.ziggy').ziggy().get('things').get('original')">
			<div class="thing">
				<img src="$page.asset($loop.it.get('id').suffix('.jpg')).link()" alt="$loop.it.get('name')" class="cover">
				<div class="description">
					<h2 :text="$loop.it.get('name')"></h2>
					<small :text="$loop.it.get('date').format('January 02, 2006')"></small>
					<ctx :if="$loop.it.get('links').get?('bandcamp')"><a href="$if">Bandcamp</a></ctx>
					<ctx :if="$loop.it.get('links').get?('youtube')"><a href="$if">YouTube</a></ctx>
					<ctx :if="$loop.it.get('links').get?('spotify')"><a href="$if">Spotify</a></ctx>
				</div>
			</div>
		</div>
	</div>

	<div>
		<h1>remasters</h1>

		<div :loop="$page.asset('data.ziggy').ziggy().get('things').get('remasters')">
			<div class="thing">
				<img src="$page.asset($loop.it.get('id').suffix('.jpg')).link()" alt="$loop.it.get('name')" class="cover">
				<div class="description">
					<h2 :text="$loop.it.get('name')"></h2>
					<small :text="$loop.it.get('date').format('January 02, 2006')"></small>
					<ctx :if="$loop.it.get('links').get?('youtube')"><a href="$if">YouTube</a></ctx>
				</div>
			</div>
		</div>
	</div>
</div>
