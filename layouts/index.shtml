<extend template="base.shtml">

<head id="head">
</head>

<div id="content">
	<style>
		body {
			display: flex;
			flex-direction: column;
			height: 100%
		}
		
		#home {
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		
		#left {
			font-size: 16pt;
			text-align: left;
			max-width: 400px;
		}
		
		#right {
			text-align: right;
		}
		
		@media screen and (max-width: 500px) {
			#home {
				flex-direction: column;
			}
			
			#left {
				text-align: center;
			}
			
			#right {
				text-align: center;
				margin: 10pt;
			}
		}
		
		#friends {
			display: grid;
			justify-content: center;
			text-align: center;
			margin: 1em;
		}
		
		#friends .buttons a {
			text-decoration: none;
		}

		#friends h3 {
		    margin: 4pt;
		}
	</style>
	<div id="home">
		<div id="left">
			Mikołaj Lercher,
			<!-- ultra stupid way to calculate my age, 1970 year offset because unix -->
			<abbr :text="$build.generated.sub(12546, 'day').format('2006').parseInt().plus(-1970)" title="May 8, 2004"></abbr>
			<br>
			Jelenia Góra, Poland
			<br>
			developer, musician, computer science student
			<br>
			<a href="https://ipa-reader.com/?text=b%C3%A6ndi-%C3%B0%C9%99-do%CA%8A%CA%A4&voice=Amy">bændi-ðə-doʊʤ</a>
		</div>
		<div id="right">
			<a href="https://github.com/bandithedoge">GitHub</a>
			/ <a href="https://codeberg.org/bandithedoge">Codeberg</a>
			<br>
			<a rel="me" href="https://hostux.social/@bandithedoge">Mastodon</a>
			<br>
			<a href="https://www.youtube.com/channel/UCMosYVHeaPgJ14Sd-qEubzg">YouTube (bandithedoge)</a>
			<br>
			<a href="https://www.youtube.com/@misadventuresinludomusicology">YouTube (misadventures in ludomusicology)</a>
			<br>
			<a href="https://keyoxide.org/aspe%3Akeyoxide.org%3A2S6HHPVTPT2IUBB5FZ5WGPCORI">aspe:keyoxide.org:2S6HHPVTPT2IUBB5FZ5WGPCORI</a>
		</div>
	</div>

	<div id="friends">
		<div>
			<h3>friends:</h3>
			<div class="buttons" :loop="$page.asset('buttons.ziggy').ziggy()">
				<a href="$loop.it.get('url')">
					<img src="$loop.it.get('img')" alt="$loop.it.get('alt')">
				</a>
			</div>
			<h3>add me to your site:</h3>
			<div class="buttons">
				<ctx anim="$site.asset('88x31.gif').link()" static="$site.asset('88x31.png').link()">
					<a href="$ctx.anim"><img src="$ctx.anim" alt="bandithedoge (animated)"></a>
					<a href="$ctx.static"><img src="$ctx.static" alt="bandithedoge (static)"></a>
				</ctx>
			</div>
		</div>
	</div>
</div>
