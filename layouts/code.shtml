<extend template="base.shtml">

<head id="head"></head>

<div id="content">
	<ctx data="$page.asset('data.ziggy').ziggy()" urls="$ctx.data.get('urls')">
		<ul :loop="$ctx.data.get('things')">
			<ctx type="$loop.it.get('type')">
				<li>
					<span>
						<strong>
							<a href="$ctx.urls.get($ctx.type).suffix($loop.it.get('repo'))" :text="$loop.it.get('name')"></a>
						</strong>
						-
						<span :text="$loop.it.get('description')"></span>
					</span>

					<br>

					<ctx shields="$ctx.urls.get('shields')" repo="$loop.it.get('repo')">
						<div :if="$ctx.type.eql('github')">
							<img src="$ctx.shields.suffix('github/last-commit/', $ctx.repo)"
							     alt="$ctx.repo.prefix('Last commit for ')"
							>
							<img src="$ctx.shields.suffix('github/stars/', $ctx.repo)"
							     alt="$ctx.repo.prefix('Stars for ')"
							>
						</div>

						<div :if="$ctx.type.eql('codeberg')">
							<img src="$ctx.shields.suffix('gitea/last-commit/', $ctx.repo, '?gitea_url=https%3A%2F%2Fcodeberg.org')"
							     alt="$ctx.repo.prefix('Last commit for ')"
							>
							<img src="$ctx.shields.suffix('gitea/stars/', $ctx.repo, '?gitea_url=https%3A%2F%2Fcodeberg.org')"
							     alt="$ctx.repo.prefix('Stars for ')"
							>
						</div>
					</ctx>
				</li>
			</ctx>
		</ul>
	</ctx>
</div>
