<div id="things">
	<ul :loop="$page.asset('data.ziggy').ziggy().get('things')">
		<li>
			<span>
				<strong>
					<a href="$page.custom.get($loop.it.get('type')).suffix($loop.it.get('repo'))" :text="$loop.it.get('name')"></a>
				</strong>
				-
				<span :text="$loop.it.get('description')"></span>
			</span>

			<br>

			<div :if="$loop.it.get('type').eql('github')">
				<img src="$page.custom.get('shields').suffix('github/last-commit/', $loop.it.get('repo'))"
				     alt="$loop.it.get('repo').prefix('Last commit for ')"
				>
				<img src="$page.custom.get('shields').suffix('github/stars/', $loop.it.get('repo'))"
				     alt="$loop.it.get('repo').prefix('Stars for ')"
				>
			</div>

			<div :if="$loop.it.get('type').eql('codeberg')">
				<img src="$page.custom.get('shields').suffix('gitea/last-commit/', $loop.it.get('repo'), '?gitea_url=https%3A%2F%2Fcodeberg.org')"
				     alt="$loop.it.get('repo').prefix('Last commit for ')"
				>
				<img src="$page.custom.get('shields').suffix('gitea/stars/', $loop.it.get('repo'), '?gitea_url=https%3A%2F%2Fcodeberg.org')"
				     alt="$loop.it.get('repo').prefix('Stars for ')"
				>
			</div>
		</li>
	</ul>
</div>
